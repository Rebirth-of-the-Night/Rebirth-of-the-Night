# Configuration file

~CONFIG_VERSION(general): 1.0

general {
    # Settings for various structures to automark
    "auto marking" {
        # ~DEPRECATED~
        S:"AARC Compat Enabled"=true

        # Options for AARC Addon Compat
        "aarc addon" {
            # Keep on true on server to turn Antique Atlas RecurrentComplex Compatibility (AARC) Global markers into AAAM local markers.
            # Warning: turning this off will have serious side effects on the structure markers in your atlases
            # Default: true
            B:"AARC Compat Enabled"=true

            # If AAAM and Recurrent Complex are installed, but AARC Addon is missing, will notify users on login.
            # Disable if you dont want AARC Addon and dont want to be reminded of it either.
            # Default: true
            B:"Warn if not installed"=true
        }

        # Battletowers Marker Config
        battletowers {
            # Set to false to never mark this structure
            # Default: true
            B:Enabled=true

            # Mark with this Marker Type
            # Default: antiqueatlas:wizardtower
            S:Marker=antiqueatlas:wizardtower

            # Mark with this Label. Use DEFAULT to label the marker with a best fitting version.
            # Default: DEFAULT
            S:Label=DEFAULT
        }

        # Better Mineshafts Marker Config
        "better mineshafts" {
            # Set to false to never mark this structure
            # Default: false
            B:Enabled=false

            # Mark with this Marker Type
            # Default: antiqueatlas:tracks
            S:Marker=antiqueatlas:tracks

            # Mark with this Label. Use DEFAULT to label the marker with a best fitting version.
            # Default: DEFAULT
            S:Label=DEFAULT
        }

        # Custom Position Markers Config
        "custom positions" {
            # Each entry: Marker Type, Marker Label, Dimension, xMarker, zMarker, xDiscover, zDiscover.
            # xMarker/zMarker is where the marker will be located on the atlas,
            # xDiscover/zDiscover is where the player has to be to discover that marker.
            # Will get set on server world creation. Only needs to be defined on server
            # Default: []
            C:"Custom Position Markers" <
            >
        }

        # Settings for marking Gold Wyrms using a hotkey
        "defiled lands gold wyrm key" {
            # Set to false to never mark this structure
