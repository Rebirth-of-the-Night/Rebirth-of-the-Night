    # Peak of the distribution for the randomly-selected size of a village: the most probable village size. Irrelevant for Normal Order of 1 or when Maximum and Minimum are equal. Must be in the range of [Minimum, Maximum]. [range: 1.0 ~ 10.0, default: 1.0]
    S:"Village Size: Mode"=1.0

    # Village size is drawn from a convolution of this many uniform distributions. 
    # A value of 1 is uniform: all values in the range are equally likely. A value of 2 is triangular. 
    # Increasing this more narrowly centers the distribution around the value entered for Mode. [range: 1 ~ 5, default: 1]
    I:"Village Size: Normal Order"=1

    # Median distance between villages. Vanilla is 20. [range: 1 ~ 100, default: 20]
    I:"Village Spacing: Median"=20

    # Variation in distances between villages. Must be lower than Median value. Vanilla is 12. [range: 1 ~ 100, default: 12]
    I:"Village Spacing: Range"=12

    # No villages will spawn less than this many chunks from world origin (0, 0). [range: 0 ~ 100000, default: 0]
    I:"Village Spacing: Village-Free Radius"=0
}


