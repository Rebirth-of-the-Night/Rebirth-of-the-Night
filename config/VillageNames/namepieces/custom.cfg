# Configuration file

"custom name components" {
    # The fraction of names that include a prefix. [range: 0.0 ~ 1.0, default: 0.0]
    S:"Prefix Chance"=0.0

    # Prefixes that can occur before the core name.
    # Entries have a weight of 1 unless a bar and number is added specifying a different weight (e.g. | 1.4)
    S:Prefixes <
     >

    # Core names begin with one of these half-syllables. Use _ to represent a space.
    # Entries have a weight of 1 unless a bar and number is added specifying a different weight (e.g. | 1.4)
    S:"Root: Initial Pieces" <
        No
     >

    # Core names insert zero or more of these elements to build to their target lengths. Use _ to represent a space, and ^ for a blank entry.
    # Weighting depends on whether a bar and numbers are included after the element:
    # nhi - has a weighting of 1 for the first possible position, and 0 for all later positions.
    # sca | 2 - has a weighting of 2 for the first possible position, and 0 for all later positions.
    # ya | 5 0 1 - has a weighting of 5 for the first position, 0 for the second, 1 for the third, and 0 for all later positions.
    # If a position has 0 for all elements, one will be chosen weighted-randomly from all possible positions.
    S:"Root: Middle Pieces" <
     >

    # Core names end with one of these half-syllables. Use _ to represent a space, and ^ for a blank entry.
    # The raw number of ^ entries will be used to determine how frequently a name ends in a vowel sound. Modify with care.
    # Entries have a weight of 1 unless a bar and number is added specifying a different weight (e.g. | 1.4)
    S:"Root: Terminal Pieces" <
        tch
     >

    # The fraction of names that include a suffix. [range: 0.0 ~ 1.0, default: 0.0]
    S:"Suffix Chance"=0.0

    # Suffixes that can occur after the core name.
    # Entries have a weight of 1 unless a bar and number is added specifying a different weight (e.g. | 1.4)
    S:Suffixes <
     >

    # How often core names of various lengths are generated. The number in the Nth row is the weighting for N-syllable names.
    S:"Syllable Number Weighting" <
        1
        0
        0
        0
        0
        0
        0
     >
}


"custom syllable pool" {
    S:"Prefix Chance"=0.0
    S:Prefixes=
    S:"Root: Initial"=No
    S:"Root: Syllables"=
    S:"Root: Terminal"=tch
    S:"Suffix Chance"=0.0
    S:Suffixes=
    I:"Syllable Count Weighting" <
        1
        0
        0
        0
        0
        0
        0
     >
    I:"Terminal Blank Counts" <
        0
        0
        0
        0
        0
        0
        0
     >
}


