# Configuration file

client {
    # Cache biome ID lookups. Disable if a mod changes biome registrations during play.
    B:biomeIdCache=true

    # Reuse Biomes O' Plenty fog-distance calculations until position, world, or render distance changes.
    B:cachedBiomesOPlentyFog=true

    # Use Minecraft's cached lighting state for Neat health bars. Disable if health bars leave incorrect lighting.
    B:cachedNeatLightingState=true

    # Cache Smooth Font's model-view and projection matrix queries until OpenGL state changes.
    B:cachedSmoothFontMatrices=true

    # Refresh Dynamic Surroundings fog colors when the effective biome blend radius changes. Requires a restart.
    B:dynamicSurroundingsFogBlendRadiusFix=true

    # Force Better HUD blend-state refresh without OpenGL queries or blend-factor scans. Requires a restart.
    B:fastBetterHudBlendState=true

    # Batch Forge fluid state properties and reuse fluid model lookups. Disable if modded fluids render incorrectly.
    B:forgeFluidAllocations=true

    # Check only attacking Gnossics for the Traces of the Fallen drain vignette. Requires a restart.
    B:indexedGnossicVignette=true

    # Index JEI transfer alternatives and skip assignments that cannot fill more recipe slots.
    B:indexedJeiTransferGroups=true

    # Activate the JEI transfer button on release so its click does not reach the inventory underneath.
    B:jeiTransferOnRelease=true

    # Retain compact Ender IO tank recipe data and create display stacks on demand.
    B:lazyEnderIoJeiRecipes=true

    # Retain compact Forestry bottler recipe data and create display stacks on demand.
    B:lazyForestryJeiRecipes=true

    # Retain compact Thermal Expansion transposer alternatives and create display stacks on demand.
    B:lazyThermalJeiRecipes=true

    # Release Forge's loading-screen upload buffer after the splash thread stops.
    B:releaseForgeSplashBuffer=true

    # Avoid Roost's extra resource reload when custom chicken textures are already stitched.
    B:roostTextureReload=true

    # Skip fully zero-scaled ReAnimate bone subtrees, including glow layers. Requires a restart.
    B:skipCollapsedReanimateBones=true

    # Read JEI bookmarks as UTF-8 to prevent repeated encoding corruption and oversized bookmark data. Requires a restart.
    B:utf8JeiBookmarks=true
}


