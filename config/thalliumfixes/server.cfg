# Configuration file

server {
    # Maximum chunks serialized per server tick across all dimensions. Zero uses vanilla autosaves. Requires a restart. [range: 0 ~ 24, default: 4]
    I:autosaveChunkBudget=4

    # Avoid translated collision-box allocations for rejected block shapes. Requires a restart.
    B:fastCollisionQueries=true

    # Queue chunk writes and spread automatic world saves across ticks. Requires a restart.
    B:queueChunkSaving=true

    # Reuse capability lookups within SCP Lockdown living-entity updates. Requires a restart.
    B:scpEntityTickFastPath=true

    # Prevent recursive zombie-villager profession synchronization. Requires a restart.
    B:zombieVillagerProfessionSync=true
}


