##########################################################################################################
# world_generation
#--------------------------------------------------------------------------------------------------------#
# Where and how far apart structures generate. Only affects new chunks.
##########################################################################################################

world_generation {
    # How far apart dragon dens, cyclops caves, gorgon temples etc should spawn apart from eachother (this is kept seperate for each type: a dragon roost can still spawn next to a myrmex hive) [range: 0 ~ 2147483647, default: 500]
    I:"World Gen Distance"=450

    # How many blocks away does dangerous(dragons, cyclops, etc.) world gen have to generate from spawn [range: 0 ~ 2147483647, default: 800]
    I:"Dangerous World Gen Distance From Spawn"=350

    # Whether to generate structures or mobs on superflat worlds [default: true]
    B:"Generate All Structures on Superflat"=true

    # true to use dimensional blacklist, false to use the whitelist. [default: false]
    B:"use Dimension Blacklist"=false

    # Dragons cannot spawn in these dimensions' IDs
    I:"Blacklisted Dragon Dimensions" <
     >

    # Dragons can only spawn in these dimensions' IDs
    I:"Whitelisted Dragon Dimensions" <
        7
     >

    # Misc Structures(Cyclops caves, Gorgon temples, etc) cannot spawn in these dimensions' IDs
    I:"Blacklisted Misc. Structure Dimensions" <
     >

    # Misc Structures(Cyclops caves, Gorgon temples, etc) can only spawn in these dimensions' IDs
    I:"Whitelisted Misc. Structure Dimensions" <
        0
     >

