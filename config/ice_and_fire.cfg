##########################################################################################################
# client
#--------------------------------------------------------------------------------------------------------#
# Visual and interface options. They only affect the player who changes them.
##########################################################################################################

client {
    # Whether to display the dragon on the main menu or not [default: true]
    B:"Custom main menu"=false

    # Whether to use the vanilla font in the bestiary or not [default: false]
    B:"Use Vanilla Font"=true

    # True if riding dragons should make the player take a 3rd person view automatically. [default: true]
    B:"Auto 3rd person when riding dragon"=true

    # True to make the screen pink when sirens attract players [default: true]
    B:"Use Siren Shader"=true

    # Show leaves burning away (fire breath) or freezing and shattering (ice breath) when dragon breath destroys them, including whole Dynamic Trees trees, instead of the leaves vanishing instantly. Client-side particles only. [default: true]
    B:"Leaf Destruction Effects"=true

    # Enable if petrified mobs or frozen (ice cube) mobs turn invisible, freeze in place or lose their textures on your graphics card. Mobs are drawn with a plain grey/blue tint instead of the stone and ice overlay textures. This is also enabled automatically for the session if a render error occurs. [default: false]
    B:"Safe Stone And Ice Rendering"=false
}


##########################################################################################################
# compatibility
#--------------------------------------------------------------------------------------------------------#
# Integration with other mods.
##########################################################################################################

compatibility {
    # If true and Baubles is installed, the cyclops eye (charm) and hydra heart (charm) can be worn in Baubles slots and keep their effects while worn. [default: true]
    B:"Baubles Integration"=true

    # If Dynamic Trees is installed, dragon breath turns whole trees into charred or frozen copies of themselves instead of destroying single branches. Disable to use the default behavior. [default: true]
    B:"Dynamic Trees Compat"=true

    # Chance per random tick for a charred or frozen tree branch (left by dragon breath on Dynamic Trees trees) to shrink by one step and eventually vanish. 0 disables decay. [range: 0.0 ~ 1.0, default: 0.25]
    S:"Charred and Frozen Branch Decay Chance"=0.25

    # Disable this to remove easter egg with tinkers installed. [default: true]
    B:Weezer=false

    # Percentage of critical strike that will disarm with easter egg tinkers material. [range: 0.0 ~ 1.0, default: 0.2]
    S:"Easter Egg Tinkers Tool Disarm chance"=0.0
}


##########################################################################################################
# dragons
#--------------------------------------------------------------------------------------------------------#
# Dragon behavior, taming, drops and how they react to the world.
##########################################################################################################

dragons {
    # Disables dragon taming, including creative dragon meal. Eggs still hatch into wild dragons. Existing tamed dragons permanently lose ownership when loaded. Restart required. [default: false]
    B:"Disable Dragon Taming"=false

    # How long it takes(in ticks) for a dragon egg to hatch [range: 1 ~ 2147483647, default: 7200]
    I:"Dragon Egg Hatch Time"=10000

    # True if dragons can despawn. Note that if this is false there may be SERIOUS lag issues. [default: true]
    B:"Dragons Despawn"=true

    # True if tamed dragons go to sleep at night. [default: true]
    B:"Tamed Dragons Sleep"=true

    # How high dragons can fly, in Y height. [range: 100 ~ 2147483647, default: 128]
    I:"Max Dragon Flight Height"=300

    # Every tick a RNG decides whether this dragon should start flying or not, based on this chance [range: 0.0 ~ 1.0, default: 6.66E-4]
    S:"Dragon Flight Chance Per Tick"=6.66E-4

    # How many blocks away can dragons wander from their defined "home" position. [range: 1 ~ 10000, default: 40]
    I:"Dragon Wander From Home Distance"=80

    # How far away dragons will detect gold blocks being destroyed or chests being opened [range: 0 ~ 10000, default: 30]
    I:"Dragon Gold Search Length"=30

    # Dragon Flap Noise Distance - Larger number, further away you can hear it [range: 0 ~ 10000, default: 4]
    I:"Dragon Flap Noise Distance"=20

    # Dragon Flute Distance - how many chunks away is the dragon flute effective? [range: 0 ~ 10000, default: 4]
    I:"Dragon Flute Distance"=4

    # True if villagers should run away and hide from dragons and other hostile Ice and Fire mobs. [default: true]
    B:"Villagers Fear Dragons"=true

    # True if animals should run away and hide from dragons and other hostile Ice and Fire mobs. [default: true]
    B:"Animals Fear Dragons"=true

    # True if dragons can drop their skull on death. [default: true]
    B:"Dragons Drop Skull"=true

    # True if dragons can drop their heart on death. [default: true]
    B:"Dragons Drop Heart"=true

    # True if dragons can drop their blood on death. [default: true]
    B:"Dragons Drop Blood"=true

    ##########################################################################################################
    # combat
    #--------------------------------------------------------------------------------------------------------#
    # Dragon health, melee and breath damage, and what their breath cannot harm.
    ##########################################################################################################

    combat {
        # Max dragon health. Health is scaled to this [range: 1 ~ 100000, default: 500]
        I:"Dragon Health"=1600

        # Max dragon attack damage. Attack Damage is scaled to this [range: 1 ~ 10000, default: 17]
        I:"Dragon Attack Damage"=40

        # Damage dealt from a successful fire breath attack. Attack Damage is scaled to by age, so a stage 5 dragon will deal 5x as much as this number [range: 0.0 ~ 10000.0, default: 2.0]
        S:"Dragon Attack Damage(Fire breath)"=4.0

        # Damage dealt from a successful ice breath attack. Attack Damage is scaled to by age, so a stage 5 dragon will deal 5x as much as this number [range: 0.0 ~ 10000.0, default: 2.5]
        S:"Dragon Attack Damage(Ice breath)"=4.5

        # Damage dealt from a successful lightning breath attack. Attack Damage is scaled to by age, so a stage 5 dragon will deal 5x as much as this number [range: 0.0 ~ 10000.0, default: 3.5]
        S:"Dragon Attack Damage(Lightning breath)"=3.5

        # Should Fire Dragon use Smoke attack when target immune fire. [default: true]
        B:"Fire Dragon Ash Attack"=true

        # Damage decrease percentage when fire dragon use smoke attack. [range: 1.0 ~ 10000.0, default: 2.0]
        S:"Dragon Attack Damage(Smoke breath)"=2.0

        # The amount of health lightning dragons heal when they get hit by a lightning bolt. [range: 0 ~ 100000, default: 15]
        I:"Lightning Dragon Healing Amount"=15

        # True if dragons fire/ice/lightning charges create secondary explosions that launch blocks everywhere. Turn this to true if you like unfair explosions. Or lag. [default: false]
        B:"Explosive Dragon Breath"=false

        # How many blocks away can dragons spot potential prey. Note that increasing this could cause lag. [range: 1 ~ 10000, default: 128]
        I:"Dragon Target Search Length"=90

        # Entities listed here will not be affected by dragon fire burning [default: ]
        S:"Entities immune to dragon fire" <
         >

        # Entities listed here will not be affected by dragon ice freezing [default: ]
        S:"Entities immune to dragon ice" <
         >

        # Entities listed here will not be affected by dragon lightning electrocuting [default: ]
        S:"Entities immune to dragon lightning" <
         >
    }

    ##########################################################################################################
    # hunger
    #--------------------------------------------------------------------------------------------------------#
    # How fast dragons get hungry and when they hunt.
    ##########################################################################################################

    hunger {
        # Maximum dragon hunger. [range: 1 ~ 1000000, default: 100]
        I:"Dragon Max Hunger"=100

        # Starting hunger for newly spawned and hatched dragons, capped at Dragon Max Hunger. Does not change saved dragons. [range: 0 ~ 1000000, default: 100]
        I:"Dragon Starting Hunger"=100

        # Dragons hunt wildlife when hunger is below this percentage of Dragon Max Hunger. 0 disables hunger-driven hunting. Does not prevent wild dragons attacking players or retaliation. [range: 0 ~ 100, default: 90]
        I:"Dragon Hunt Hunger Threshold"=90

        # Awake ticks between losing one hunger point, including dragons with aging disabled. 20 ticks = 1 second. [range: 1 ~ 2147483647, default: 3000]
        I:"Dragon Hunger Tick Rate"=3000
    }

    ##########################################################################################################
    # griefing
    #--------------------------------------------------------------------------------------------------------#
    # Which blocks dragons may break, burn or freeze.
    ##########################################################################################################

    griefing {
        # Dragon griefing - 2 is no griefing, 1 is breaking weak blocks, 0 is default [range: 0 ~ 2, default: 0]
        I:"Dragon Griefing"=0

        # True if tamed dragons can follow the griefing rules. [default: true]
        B:"Tamed Dragon Griefing"=false

        # True if dragons can break blocks if they get stuck. Turn this off if your dragons randomly explode. [default: true]
        B:"Dragons Dig When Stuck"=true

        # Every interval of this number in ticks, dragon allowed to break blocks. [range: 0 ~ 10000, default: 5]
        I:"Dragon Block Break Cooldown"=5

        # The percentage chance for a block to drop as an item when a dragon breaks it. [range: 0.0 ~ 1.0, default: 0.1]
        S:"Dragon Block Breaking Drop Chance"=0.0

        # Blacklist for blocks that dragons are not to break or burn. Ex. "minecraft:sponge" or "rats:rat_crafting_table" [default: ]
        S:"Blacklisted Blocks from Dragon" <
            minecraft:chest
            dimstack:portal
            dimstack:bedrock
         >

        # If true, then the blacklist will act as a whitelist. [default: false]
        B:"Blacklisted Blocks from Dragon is a Whitelist"=false

        # Blocks that will not drop as items when broken by a dragon. Ex. "minecraft:chest" or "rats:rat_crafting_table" [default: [minecraft:stone], [minecraft:dirt], [minecraft:grass]]
        S:"No-Drop Blocks from Dragon Block Breaking" <
            minecraft:stone
            minecraft:dirt
            minecraft:grass
         >

        # Blocks that dragon breath and charges will not transform (charred/frozen/crackled) or destroy. Ex. "minecraft:sponge" or "rats:rat_crafting_table" [default: ]
        S:"Dragon Breath Immune Blocks" <
         >
    }

    ##########################################################################################################
    # pathfinding
    #--------------------------------------------------------------------------------------------------------#
    # Dragon pathfinding and server movement fixes.
    ##########################################################################################################

    pathfinding {
        # A more intelligent dragon pathfinding system, but is also laggier. Turn this on if you think dragons are too stupid. [default: false]
        B:"Intelligent Dragon Pathfinding"=true

        # Turning this to true simplifies the dragon's pathfinding process, making them dumber when finding a path, but better for servers with many loaded dragons. [default: false]
        B:"Experimental Dragon path Finder"=false

        # Enable this if your server is being bombarded with moved wrongly or moved too fast console messages. REQUIRES RESTART! [default: false]
        B:"Dragon Moved Wrongly Error Fix"=false
    }

}


##########################################################################################################
# dreadlands
#--------------------------------------------------------------------------------------------------------#
# The Dreadlands dimension and the dread castle.
##########################################################################################################

dreadlands {
    # Enable dreadland dimension. [default: true]
    B:"Enable Dreadlands"=true

    # Use the normal Minecraft snow look in the Dreadlands instead of the thick dread snow. The snow also no longer fades after the Dread Queen is defeated. [default: false]
    B:"Dreadlands Vanilla Snow"=false

    # Maximum castle ballista arrow strength. [range: 1 ~ 100, default: 10]
    I:"Ballista Arrow Damage"=10

    # Maximum ticks between castle ballista shots (20 ticks = 1 second). Lower is faster. [range: 1 ~ 1200, default: 60]
    I:"Castle Ballista Fire Interval"=60

    # Ticks between final ballista shots when ridden (20 ticks = 1 second). Lower is faster. [range: 1 ~ 1200, default: 100]
    I:"Final Ballista Cooldown"=100
}


##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Logging and other options that fit nowhere else.
##########################################################################################################

general {
    # Whether to print the startup verse and season 8 comment to the console. [default: false]
    B:"Log Startup Verse"=false

    # Whether to log cascading world gen lag. We hope to fix all cascading lag in the future, but the server console spam is over the top. [default: false]
    B:"Log Cascading World Gen"=false

    # Registers the Creative-only structure teleporter items and records structure locations as they generate. Requires a restart. When false, no items are registered and nothing is tracked. [default: false]
    B:"Enable Structure Locator"=false
}


##########################################################################################################
# items
#--------------------------------------------------------------------------------------------------------#
# Items, weapons and armor.
##########################################################################################################

items {
    # True if the summon crystal can load chunks to find dragons. [default: true]
    B:"Chunk Load Summon Crystal"=true

    # IDs of mobs that the siren flute will not work on [default: ]
    S:"Siren Flute Mob Blacklist" <
     >

    # Length in required between the activation of the Blooded Dragon Armor Set Effects [range: 10 ~ 1000, default: 100]
    I:"Blooded Dragon Armor Set Effect Cooldown"=100

    ##########################################################################################################
    # weapons
    #--------------------------------------------------------------------------------------------------------#
    # Dragonsteel, the tide trident and the phantasmal blade.
    ##########################################################################################################

    weapons {
        # Default attack strength of a dragonsteel sword. [range: 5.0 ~ 2.1474836E9, default: 25.0]
        S:"Dragonsteel Sword Base Attack Strength"=25.0

        # Default armor value of dragonsteel chestplate. [range: 7 ~ 2147483647, default: 12]
        I:"Dragonsteel Base Armor"=12

        # Default durability value of dragonsteel sword. [range: 1 ~ 2147483647, default: 8000]
        I:"Dragonsteel Base Durability"=8000

        # Whether or not should dragonsteel tools knockback the target on hit [default: true]
        B:"Dragonsteel Knockback"=true

        # Base damage for the Tide Trident [range: 1.0 ~ 10000.0, default: 13.0]
        S:"Base damage for the Tide Trident"=13.0

        # Damage multiplier for the Tide Trident - applied when the trident is underwater [range: 1.0 ~ 10000.0, default: 2.0]
        S:"Tide Trident Underwater Damage Multiplier"=2.0

        # Attack speed modifier of the phantasmal blade, added to the base player attack speed of 4.0. More negative is slower (vanilla swords use -2.4). [range: -3.9 ~ 10.0, default: -2.4]
        S:"Phantasmal Blade Attack Speed Modifier"=-2.4

        # Ticks between phantasmal blade shots (20 ticks = 1 second). Lower is faster. [range: 0 ~ 1200, default: 20]
        I:"Phantasmal Blade Shot Cooldown"=20
    }

    ##########################################################################################################
    # arrows
    #--------------------------------------------------------------------------------------------------------#
    # Damage of the special arrows.
    ##########################################################################################################

    arrows {
        # Base damage of dragonbone arrows (vanilla arrows use 2). Multiplied by arrow speed on impact, so a fully drawn bow deals roughly 3x this. Power enchantment adds on top. [range: 0.5 ~ 100.0, default: 10.0]
        S:"Dragonbone Arrow Damage"=10.0

        # Base damage of amphithere arrows (vanilla arrows use 2). Multiplied by arrow speed on impact. [range: 0.5 ~ 100.0, default: 2.5]
        S:"Amphithere Arrow Damage"=2.5

        # Base damage of hydra arrows (vanilla arrows use 2). Multiplied by arrow speed on impact. [range: 0.5 ~ 100.0, default: 5.0]
        S:"Hydra Arrow Damage"=5.0

        # Base damage of sea serpent arrows (vanilla arrows use 2). Multiplied by arrow speed on impact. [range: 0.5 ~ 100.0, default: 3.0]
        S:"Sea Serpent Arrow Damage"=3.0

        # Base damage of stymphalian arrows (vanilla arrows use 2). Multiplied by arrow speed on impact. [range: 0.5 ~ 100.0, default: 3.5]
        S:"Stymphalian Arrow Damage"=3.5
    }

    ##########################################################################################################
    # hydra_heart
    #--------------------------------------------------------------------------------------------------------#
    # The regeneration given by the hydra heart.
    ##########################################################################################################

    hydra_heart {
        # Durability of the hydra heart. It loses 1 durability each time it applies regeneration. [range: 1 ~ 100000, default: 800]
        I:"Hydra Heart Durability"=800

        # Duration in seconds of the regeneration applied by the hydra heart. The level is re-evaluated each time it runs out. [range: 1 ~ 60, default: 10]
        I:"Hydra Heart Regeneration Duration"=10

        # Regeneration amplifier (0 = Regeneration I) when health is under 100%. -1 disables regeneration at this health range. [range: -1 ~ 9, default: 0]
        I:"Hydra Heart Regeneration Amplifier (below 100% health)"=0

        # Regeneration amplifier (0 = Regeneration I) when health is under 75%. -1 disables regeneration at this health range. [range: -1 ~ 9, default: 1]
        I:"Hydra Heart Regeneration Amplifier (below 75% health)"=1

        # Regeneration amplifier (0 = Regeneration I) when health is under 50%. -1 disables regeneration at this health range. [range: -1 ~ 9, default: 2]
        I:"Hydra Heart Regeneration Amplifier (below 50% health)"=2

        # Regeneration amplifier (0 = Regeneration I) when health is under 25%. -1 disables regeneration at this health range. [range: -1 ~ 9, default: 3]
