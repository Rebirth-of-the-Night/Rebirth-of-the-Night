# Configuration file

general {
    B:activeSound=false
    D:chopBonusDamage=8.0
    D:contactDamage=4.0
    B:damageEntities=true
    B:finishedSound=true
    B:immersiveMode=true
    I:jeiExtraOutputRows=1
    I:powerMaximum=1
    I:powerRequired=1
    B:requiresPower=true
    B:rotateWithHand=true
