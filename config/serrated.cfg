# Configuration file

general {
    # Do cutting saws constantly play a sound while active?
    B:activeSound=false

    # Do cutting saws damage entities in contact with their blades?
    B:damageEntities=true

    # Do cutting saws play a sound when a recipe finishes?
    B:finishedSound=true

    # Do cutting saws do in-world crafting?
    B:immersiveMode=true

    # The number of rows of extra cutting saw outputs (4 per row) that are shown in JEI.
    # If there isn't enough space for all of a recipe's outputs, they'll render out-of-bounds!
    # Min: 0
    # Max: 2147483647
    I:jeiExtraOutputRows=1

    # Maximum amount of BWM mechanical power a cutting saw can handle before it overpowers.
    # Min: 0
    # Max: 2147483647
    I:powerMaximum=1

    # Amount of BWM mechanical power required for cutting saws to work.
    # Set to zero to disable the power requirement.
    # Min: 0
    # Max: 2147483647
    I:powerRequired=1
    B:requiresPower=true

    # Can cutting saws be rotated by shift-right-clicking them?
    # This is useful for when immersive mode is enabled and there aren't any modded wrenches available.
    B:rotateWithHand=true

    # Do cutting saws play a sound while processing a recipe?
    B:workingSound=true
}


