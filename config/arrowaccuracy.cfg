# Configuration file

general {

    ##########################################################################################################
    # client options
    #--------------------------------------------------------------------------------------------------------#
    # Client-Side Options
    ##########################################################################################################

    "client options" {
        # Ticks at the end of the stuck duration the arrow spends fading out. 0 disables fading.
        # Min: 0
        # Max: 72000
        I:"Fade Out Duration"=20

        # Hides the vanilla randomly placed arrows rendered in players.
        B:"Hide Vanilla Player Arrows"=true

        # Ticks a stuck arrow waits for the server to confirm the hit by removing the arrow entity. Raise if high ping causes stuck arrows to vanish.
        # Min: 1
        # Max: 200
        I:"Hit Confirmation Timeout"=40

        # Maximum amount of arrows rendered in a single entity. Oldest arrows are removed first.
        # Min: 1
        # Max: 256
        I:"Max Arrows Per Entity"=16

        # Ticks an arrow stays stuck in an entity.
        # Min: 1
        # Max: 72000
        I:"Stuck Arrow Duration"=600
    }

}


